# Confirmatory run for the co-primary accuracy and spam-recall claims. The split
# seed differs from the original certificate so this is a fresh single-use test
# set. Both endpoints share one 0.05 family-wise error budget via Bonferroni.
task: intent_classification
dataset: ucirvine/sms_spam
dataset_config: plain_text
constraints:
  minimum_accuracy: 0.95
  confidence_level: 0.95
  max_p95_latency_ms: 200
objective: minimize_cost
teacher:
  provider: groq
  model: openai/gpt-oss-20b
  prompt_version: v1
  price_per_million_input_tokens: 0.0
  price_per_million_output_tokens: 0.0
  rate_limits:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
students: [word_tfidf]
splits:
  student_train: 4000
  calibration: 200
  certification: 600
  seed: 43
threshold_grid_size: 50
seed: 43
