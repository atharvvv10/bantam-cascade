# Default pinned teacher values supplied by the user (free-tier Groq account).
# Prices are 0 on the free tier; change them only if the account becomes paid.
# Verified HF id: clinc/clinc_oos, config "imbalanced".
# In-scope intents only: the "oos" label is excluded (documented in data loading).
task: intent_classification
dataset: clinc/clinc_oos
dataset_config: imbalanced
exclude_labels: [oos]
constraints:
  minimum_accuracy: 0.95
  confidence_level: 0.95
  max_p95_latency_ms: 200
objective: minimize_cost
teacher:
  provider: groq
  model: openai/gpt-oss-20b
  prompt_version: v1
  price_per_million_input_tokens: 0.0
  price_per_million_output_tokens: 0.0
  rate_limits:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
students: [static_embed, minilm_onnx_int8]
# Split sizes are sized for the free-tier Groq limits: calibration needs 200
# teacher calls; certification needs 300.
splits:
  student_train: 4000
  calibration: 200
  certification: 300
  seed: 42
threshold_grid_size: 50
seed: 42
