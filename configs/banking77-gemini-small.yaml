# Cascade-benefit ablation: 77 intents, pinned Gemini Decisions teacher,
# CPU-only tfidf_baseline student trained on a deliberately small gold-label budget.
# Certification split size is unchanged; no certificate is claimed by this config.
task: intent_classification
dataset: PolyAI/banking77
constraints:
  minimum_accuracy: 0.95
  confidence_level: 0.95
  max_p95_latency_ms: 200
objective: minimize_cost
teacher:
  provider: gemini
  model: gemini-decision-1
  prompt_version: v1
  price_per_million_input_tokens: 0.0
  price_per_million_output_tokens: 0.0
  rate_limits:
    requests_per_minute: 200
    requests_per_day: 10000
    tokens_per_minute: 50000
students: [tfidf_baseline]
splits:
  student_train: 4000
  calibration: 200
  certification: 300
  seed: 42
threshold_grid_size: 50
seed: 42
