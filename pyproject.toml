[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bantam-cascade"
version = "0.1.1"
description = "Certify the cheapest small-CPU-model plus big-LLM fallback cascade for text classification."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bantam Cascade contributors" }]
keywords = ["classification", "distillation", "calibration", "cascade", "certification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "scikit-learn==1.9.1",
  "pandas==3.1.1",
  "matplotlib==3.11.2",
  "pydantic==2.14.4",
  "pyyaml==6.0.4",
  "typer==0.29.2",
  "rich==15.0.0",
  "datasets==5.2.0",
  "httpx==0.28.1",
  "tenacity==9.2.1",
]

[project.optional-dependencies]
students = [
  "model2vec==0.10.0",
  "sentence-transformers==6.3.0",
  "onnx==1.23.2",
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
]
demo = ["gradio==6.32.0"]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.17",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261122",
  "pre-commit==4.7.0",
  "build==1.6.1",
  "twine==7.0.0",
  "Pillow==13.0.0",
]

[project.scripts]
bantam-cascade = "bantam_cascade.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bantam_cascade = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "D100", "D103"]
"src/bantam_cascade/cli.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bantam_cascade"]

[[tool.mypy.overrides]]
module = ["datasets.*", "gradio.*", "joblib.*", "model2vec.*", "onnx.*", "onnxruntime.*", "scikit-learn.*", "sklearn.*", "sentence_transformers.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
